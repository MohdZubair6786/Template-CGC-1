<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="table tag">
  <title>Table Tag</title>
</head>
<body>
  <table border="2px" width="400px" align="center">
    <thead>
      <td colspan="3" align="center" rowspan="2">student</td>
    </thead>
    <thead align="center">
      <td>S.NO</td>
      <td>NAME</td>
      <td>ADDRESS</td>
    </thead>
    <tbody align="center">
      <tr>
      <td>1</td>
      <td>Mohd</td>
      <td>hyderabad   </td>
      </tr>
      <tr>
        <td>1</td>
        <td>Ahmed</td>
        <td>Banguluru</td>
        </tr>
        <tr>
          <td colspan="2" align="end">total </td>
          <td colspan="1" align="start">2</td>
        </tr>
    </tbody>
  </table>
  
</body>
</html>
